# Self-contained, throwaway workspace for spike 0.3 (see docs/adr/0001-typescript-7-toolchain.md).
# It has its own lockfile so the spike can be deleted without touching the root workspace.
packages:
  - api
  - contracts
  - web
  - landing

# One @types/node for the whole graph, matching the minimum supported Node major (engines, CI).
# Transitive @types/* packages ask for `@types/node: '*'`, which would otherwise pull the latest major.
overrides:
  '@types/node': 24.19.2

# Dependency build scripts are denied unless listed here with `true`.
allowBuilds:
  '@nestjs/core': false
  '@swc/core': false
  esbuild: false

minimumReleaseAgeExclude:
  - '@oxlint-tsgolint/darwin-arm64@7.0.2009'
  - '@oxlint-tsgolint/darwin-x64@7.0.2009'
  - '@oxlint-tsgolint/linux-arm64@7.0.2009'
  - '@oxlint-tsgolint/linux-x64@7.0.2009'
  - '@oxlint-tsgolint/win32-arm64@7.0.2009'
  - '@oxlint-tsgolint/win32-x64@7.0.2009'
  - oxlint-tsgolint@7.0.2009
  - '@nestjs/common@12.6.3'
  - '@nestjs/core@12.6.3'
  - '@nestjs/platform-express@12.6.3'
  - '@nestjs/testing@12.6.3'
  - vite@8.4.0
