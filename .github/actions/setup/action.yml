# Shared job setup for the root workspace (run after actions/checkout).
name: Set up the workspace
description: pnpm from packageManager, Node 24 with the pnpm store cache, frozen install without lifecycle scripts.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: pnpm
    # --ignore-scripts skips the root `prepare` (lefthook install), which CI doesn't need.
    - name: Install (frozen lockfile)
      shell: bash
      run: pnpm install --frozen-lockfile --ignore-scripts
