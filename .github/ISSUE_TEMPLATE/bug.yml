name: Bug report
description: Something doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please don't post personal or health data. For security issues, don't open a public issue; contact the maintainer privately instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Tap …
        3. See …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Web app, iPhone app, Apple Watch app, Landing page, API, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / environment
      description: App version or commit, OS and device or browser.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any personal data first.
