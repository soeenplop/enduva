# Receipt-gated production deploy (roadmap 0.12b/0.12c; 06-deployment.md, "Pipeline"). The main pipeline
# (images.yml) calls it once the isolated candidate verifier has written the production receipt for this SHA. It
# checks the sign-up lock, migrates production (receipt-gated), deploys the same image digests to Dokploy and runs
# the smoke tests. Its secrets are the `production` environment's (docs/runbooks/deploy.md), so only this job and the
# pipeline's read-only `baseline` job can read them.
name: deploy-production

on:
  workflow_call:
    inputs:
      receipt:
        description: Production receipt for this SHA (JSON, tools/receipt-gate.mjs)
        type: string
        required: true
      digests:
        description: Image digests of this SHA (JSON, e.g. {"api":"sha256:…"})
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: deploy (production)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://app.enduva.de
    # The production lock: no two production writes overlap, and the migrations and the deploy of the same digests
    # run in this one job, so nothing changes the migration history between the receipt check and the deploy.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      SHA: ${{ github.sha }}
      RECEIPT_JSON: ${{ inputs.receipt }}
      DIGESTS_JSON: ${{ inputs.digests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Under the lock, before any write: only the current head of main deploys. A re-run of an older run (GitHub
      # keeps its SHA) would otherwise roll production back; it writes nothing and leaves production to the newer run.
      - name: Still the head of main
        id: fresh
        run: |
          head="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)"
          if [ "$head" = "$SHA" ]; then
            echo current=true >>"$GITHUB_OUTPUT"
          else
            echo "::warning::$SHA is no longer the head of main ($head). Nothing is written; the newer run deploys."
            echo current=false >>"$GITHUB_OUTPUT"
          fi
      - if: steps.fresh.outputs.current == 'true'
        uses: ./.github/actions/setup
      - if: steps.fresh.outputs.current == 'true'
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.2.0
      - name: Inputs to files
        if: steps.fresh.outputs.current == 'true'
        run: |
          printf '%s' "$RECEIPT_JSON" >"$RUNNER_TEMP/receipt.json"
          printf '%s' "$DIGESTS_JSON" >"$RUNNER_TEMP/digests.json"
      # Production hosts go live only with the sign-up lock active (G1.0): no write at all otherwise.
      - name: Sign-up lock is active
        if: steps.fresh.outputs.current == 'true'
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: node tools/supabase-auth-bootstrap.mjs --verify
      # Deployments an earlier, cancelled or timed-out job left queued or running in Dokploy finish first.
      - name: Dokploy is idle
        if: steps.fresh.outputs.current == 'true'
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: deploy/scripts/deploy.sh --wait-idle
      # Refuses (no production write) unless the receipt matches this SHA, the digests, the migration set and the
      # applied production history (deploy/scripts/db-push.sh). A stale receipt, e.g. on a re-run after the
      # migrations succeeded but the deploy failed, is refused here: re-run all jobs to re-verify.
      - name: Migrate production (receipt-gated)
        if: steps.fresh.outputs.current == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: RECEIPT="$RUNNER_TEMP/receipt.json" DIGESTS="$RUNNER_TEMP/digests.json" deploy/scripts/db-push.sh
      # The worker's smoke job must be newer than this, measured on the database's clock.
      - name: Deploy start
        id: start
        if: steps.fresh.outputs.current == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: echo "since=$(psql "$SUPABASE_DB_URL" -Atc 'select now()')" >>"$GITHUB_OUTPUT"
      - name: Deploy the same image digests
        if: steps.fresh.outputs.current == 'true'
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          TITLE: ${{ github.sha }} (run ${{ github.run_id }}.${{ github.run_attempt }})
        run: DIGESTS="$RUNNER_TEMP/digests.json" deploy/scripts/deploy.sh
      - name: Smoke tests
        if: steps.fresh.outputs.current == 'true'
        env:
          API_URL: https://api.enduva.de
          WEB_URL: https://app.enduva.de
          LANDING_URL: https://enduva.de
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SINCE: ${{ steps.start.outputs.since }}
        run: deploy/scripts/smoke.sh
