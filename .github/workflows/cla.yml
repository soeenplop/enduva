# CLA check for external contributions (decision T24, see CLA.md).
# Contributors sign by commenting the sign phrase on their PR. Signatures are
# stored in signatures/cla.json on the `cla-signatures` branch.
#
# Security: this runs on pull_request_target with write permissions, so it
# must NEVER check out or execute code from the pull request.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize, reopened]

permissions: {}

env:
  # Exact logins only. Keep in sync with the allowlist documented in CONTRIBUTING.md.
  CLA_ALLOWLIST: soeenplop,dependabot[bot],renovate[bot],github-actions[bot]

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    permissions:
      actions: write # re-run the PR's CLA check after a signature comment
      contents: write # write signatures to the cla-signatures branch
      pull-requests: write # comment on and lock pull requests
      statuses: write
    steps:
      # CLA Assistant Lite resolves commit authors that are not linked to a
      # GitHub account by their free-text git author name, which anyone can set
      # (e.g. to an allowlisted login). For PRs opened by non-allowlisted
      # accounts, require every commit author to be a linked GitHub user that is
      # not on the allowlist, so the CLA check can't be bypassed that way.
      - name: Verify commit authors
        if: github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
        run: |
          set -euo pipefail
          allowlisted() { case ",$CLA_ALLOWLIST," in *",$1,"*) return 0 ;; *) return 1 ;; esac; }
          if allowlisted "$PR_AUTHOR"; then
            echo "PR opened by allowlisted account $PR_AUTHOR."
            exit 0
          fi
          commits=$(gh api graphql --paginate \
            -F owner="${REPO%/*}" -F name="${REPO#*/}" -F number="$PR_NUMBER" \
            -f query='query($owner: String!, $name: String!, $number: Int!, $endCursor: String) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $number) {
                  commits(first: 100, after: $endCursor) {
                    nodes { commit { oid author { user { login } } } }
                    pageInfo { hasNextPage endCursor }
                  }
                }
              }
            }' \
            --jq '.data.repository.pullRequest.commits.nodes[].commit | "\(.oid) \(.author.user.login // "-")"')
          fail=0
          while read -r oid login; do
            if [ "$login" = "-" ]; then
              echo "::error::Commit $oid: author email is not linked to a GitHub account. Add it to your account (or amend the commit) and push again."
              fail=1
            elif allowlisted "$login"; then
              echo "::error::Commit $oid is attributed to allowlisted account $login in a PR opened by $PR_AUTHOR. A maintainer must review this manually."
              fail=1
            fi
          done <<< "$commits"
          exit "$fail"

      - name: CLA Assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          path-to-document: https://github.com/soeenplop/enduva/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: ${{ env.CLA_ALLOWLIST }}
