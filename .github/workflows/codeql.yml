# CodeQL code scanning (task 0.5). Non-required check: it reports security alerts and is not in
# the `main` ruleset's required status checks (.github/rulesets/main.json).
# T1/W13: CodeQL is an approved standalone analysis exception (ADR-0001). Its JS/TS extractor runs
# its own bundled TypeScript 5.x on GitHub's runner only to parse our sources for its analysis; it
# is not installed via pnpm, never type-checks, emits or serves a language service for our build,
# and influences no artifact.
name: codeql

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly, Monday 03:17 UTC: new queries also run against an unchanged main.
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Interpreted languages: build mode `none`, no install or build step needed.
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - name: Analyze
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:${{ matrix.language }}
