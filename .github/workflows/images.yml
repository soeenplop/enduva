# Container images (task 0.12a, deploy/README.md) and, on `main`, the production pipeline (task 0.12c).
# Pull requests build every image (api, also the worker; web; landing) without pushing. A push to `main` builds and
# pushes them to GHCR, verifies exactly those digests in the isolated candidate environment against the applied
# production migration history, and hands the receipt to the receipt-gated production deploy
# (06-deployment.md, "Pipeline", single-environment phase). The `image (…)` jobs are required checks
# (.github/rulesets/main.json): renaming one needs the ruleset updated in the same PR.
name: images

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Pushes to `main` run one at a time in `main-pipeline` (a later push waits, nothing is cancelled).
concurrency:
  group: ${{ github.event_name == 'push' && 'main-pipeline' || format('images-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The builder and the SBOM scanner are pinned as well, not only the actions: Buildx by release, BuildKit and the
# scanner image by digest (the defaults float: the runner's Buildx, `moby/buildkit:buildx-stable-1`,
# `docker/buildkit-syft-scanner:stable-1`). A bump changes version and digest together.
env:
  BUILDX_VERSION: v0.39.1
  BUILDKIT_IMAGE: moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c
  SBOM_GENERATOR: docker/buildkit-syft-scanner:1.13.0@sha256:a190379321cf51fba8c284a1834555b55e7bf58d577d574db23370461defc430

jobs:
  build:
    name: image (${{ matrix.image }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [api, web, landing]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.image }}
          platforms: linux/amd64
          push: false
          # Pull requests read main's layer cache but write only their own scope.
          cache-from: |
            type=gha,scope=image-${{ matrix.image }}-refs/heads/main
            type=gha,scope=image-${{ matrix.image }}-${{ github.ref }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.image }}-${{ github.ref }}
      # Once per run: planted credential files must stay out of the build context (.dockerignore).
      - name: Build context keeps credentials out
        if: matrix.image == 'api'
        run: tools/check-docker-context.sh

  publish:
    name: publish (${{ matrix.image }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The only job with write access to packages.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [api, web, landing]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/enduva-${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # One tag per commit (`sha-<full sha>`) to find a commit's image; deploys use the digest, never a tag.
      # No `latest`. Provenance and SBOM are stored as attestations next to the image.
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.image }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Elastic-2.0
          provenance: mode=max
          # The web image carries sbom/web.cdx.json (bundled dependencies, deploy/Dockerfile); the scanner merges it.
          sbom: generator=${{ env.SBOM_GENERATOR }}
          cache-from: type=gha,scope=image-${{ matrix.image }}-refs/heads/main
          cache-to: type=gha,mode=max,scope=image-${{ matrix.image }}-refs/heads/main
      - name: Digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          NAME: ${{ matrix.image }}
        run: |
          echo "${IMAGE}@${DIGEST}"
          echo "\`${IMAGE}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
          jq -n --arg image "$NAME" --arg digest "$DIGEST" '{($image): $digest}' >"$RUNNER_TEMP/$NAME.json"
      # The pipeline takes each digest from here, straight from the push, never from a tag.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}
          path: ${{ runner.temp }}/${{ matrix.image }}.json
          retention-days: 30

  # The migration history production has applied right now: what the candidate is verified against. Read-only,
  # but it needs the production database URL, so it runs in the `production` environment.
  baseline:
    name: baseline (production history)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    outputs:
      applied: ${{ steps.read.outputs.applied }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the applied migration history
        id: read
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          deploy/scripts/applied-migrations.sh >"$RUNNER_TEMP/applied"
          { echo 'applied<<EOF'; cat "$RUNNER_TEMP/applied"; echo EOF; } >>"$GITHUB_OUTPUT"

  # Isolated candidate verifier (deploy/scripts/verify-candidate.sh): a fresh local Supabase stack, no production
  # credentials. Writes the production receipt only if everything passed.
  verify:
    name: verify (isolated candidate)
    needs: [publish, baseline]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    outputs:
      digests: ${{ steps.digests.outputs.json }}
      receipt: ${{ steps.verify.outputs.receipt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.2.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Digests of this push
        id: digests
        run: |
          jq -cs add "$RUNNER_TEMP"/digests/*.json >"$RUNNER_TEMP/digests.json"
          echo "json=$(cat "$RUNNER_TEMP/digests.json")" >>"$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the candidate against the production history
        id: verify
        env:
          SHA: ${{ github.sha }}
          APPLIED: ${{ needs.baseline.outputs.applied }}
        run: |
          printf '%s\n' "$APPLIED" | sed '/^$/d' >"$RUNNER_TEMP/baseline"
          SHA="$SHA" DIGESTS="$RUNNER_TEMP/digests.json" BASELINE="$RUNNER_TEMP/baseline" \
            RECEIPT="$RUNNER_TEMP/receipt.json" deploy/scripts/verify-candidate.sh
          echo "receipt=$(jq -c . "$RUNNER_TEMP/receipt.json")" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-receipt
          path: ${{ runner.temp }}/receipt.json
          retention-days: 90

  deploy:
    name: deploy
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-production.yml
    with:
      receipt: ${{ needs.verify.outputs.receipt }}
      digests: ${{ needs.verify.outputs.digests }}
    secrets: inherit
