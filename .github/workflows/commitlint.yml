# Conventional Commits (docs/plan/05-workflow.md#commits) on the PR title and on every commit of
# the PR. Its own workflow because it also runs on `edited` (title changes); the other CI jobs
# must not re-run, or be skipped, on an edit. The job name is a required status check.
name: commitlint

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: commitlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: commitlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # Untrusted values go through env, never into the script text.
      - name: PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose
      # commitlint's default ignores are off (commitlint.config.mjs). Merge commits (`git merge main`
      # once review has started) are skipped by their parents, not by their message.
      - name: Every non-merge commit of the PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: tools/commitlint-range.sh "$BASE_SHA" "$HEAD_SHA"
