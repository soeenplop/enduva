# Root workspace CI (task 0.5). The job names are the required status checks of the `main`
# ruleset (.github/rulesets/main.json): renaming a job needs the ruleset updated in the same PR.
# Commitlint runs in commitlint.yml, because it must re-run when a PR title is edited.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  build:
    name: build-typecheck-lint-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build, typecheck, lint and test (turbo)
        run: pnpm turbo build typecheck lint test
      # Turbo's `generate` tasks ran above. A committed generated file (apps/api/openapi.json from the Zod contracts)
      # that differs from the fresh output, or a generated file missing from git, fails here.
      - name: Generated files are committed and up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git --no-pager diff --stat
            echo "::error::Generated files are stale. Run 'pnpm turbo run generate' and commit the result."
            exit 1
          fi

  format:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Format check (oxfmt)
        run: pnpm format:check

  ts7-audits:
    name: ts7-audits
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Each audit runs its self-test first (ADR-0001). The bundled-TS audit scans this runner's
      # frozen install, so it must stay after the install step.
      - name: TS 7 audits (lockfile, bundled TypeScript, pnpm why typescript)
        run: pnpm audit:ts

  negative-tests:
    name: negative-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Negative tests (tsc and oxlint must fail on the broken fixtures)
        run: pnpm test:negative

  # Browser tests (0.9a): web smoke test and the landing's 320 px reflow check (#113), on the production builds.
  # playwright-core only, driven from Vitest (apps/web/README.md, E2E; lead decision W13 on PR #134). Required check.
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The browser build is the one the pinned playwright-core expects.
      - name: Install Chromium and its system dependencies
        run: pnpm --filter @enduva/web exec playwright-core install --with-deps --only-shell chromium
      - name: E2E (turbo, after the builds)
        run: pnpm test:e2e

  # Required (lead decision on PR #126): the generated Swift client compiles from the committed
  # apps/api/openapi.json, and its middlewares and body decoding pass their tests. No pnpm needed: the build job's
  # drift check keeps the spec in sync with the contracts. It runs on every PR (no path filter), as a required
  # check must.
  swift-client:
    name: swift-client
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/apple/EnduvaAPIClient
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version
      - name: Generate, compile and test the Swift client (swift-openapi-generator build plugin)
        run: swift test --force-resolved-versions

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Release tarball pinned by version and SHA-256 (from gitleaks_<version>_checksums.txt).
      # A bump changes both values.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      # The scan includes merge commits' diffs; the self-test proves it on a throwaway repo first.
      - name: Self-test (a secret added only in a merge resolution must be found)
        run: tools/gitleaks-scan.sh "$RUNNER_TEMP/gitleaks" --self-test
      - name: Scan the full git history, merge commits included
        run: tools/gitleaks-scan.sh "$RUNNER_TEMP/gitleaks" .
