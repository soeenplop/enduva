# Landing page (deploy/Dockerfile, target `landing`): the prerendered site from apps/landing/dist/client.
# TLS, HSTS and the public host are Traefik's job (Dokploy); this server only answers on the container network.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # Relative redirects (`/de` -> `/de/`), so they never name the container's own port.
    absolute_redirect off;
    # No client IPs on disk or in the container log (data minimisation); the ingress is the only access log.
    access_log off;

    location / {
        # `/de/` serves `/de/index.html`, the prerendered page; anything else that doesn't exist is a 404.
        try_files $uri $uri/ =404;
    }

    # Vite's content-hashed assets never change under the same URL.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
